{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="form-container glassmorphism fade-in">
    <h2 class="gradient-text" style="text-align: center; margin-bottom: 2rem;">Join Nexus</h2>
    <form method="POST">
        {% csrf_token %}
        <fieldset class="form-group">
            {{ form|crispy }}
        </fieldset>
        <div class="form-group" style="margin-top: 2rem;">
            <button class="btn btn-primary" type="submit" style="width: 100%;">Sign Up</button>
        </div>
    </form>
    <div style="text-align: center; margin-top: 1.5rem;">
        <small style="color: var(--text-secondary);">
            Already Have An Account? <a href="{% url 'login' %}" style="color: var(--accent-primary);">Sign In</a>
        </small>
    </div>
</div>
{% endblock content %}
