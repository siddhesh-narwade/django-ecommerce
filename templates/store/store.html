{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="row">
    <div class="header-section" style="text-align: center; margin-bottom: 2rem;">
        <h1 class="gradient-text" style="font-size: 3rem;">Discover Excellence</h1>
        <p style="color: var(--text-secondary); max-width: 600px; margin: 0 auto;">Explore our premium collection of products curated just for you.</p>
    </div>

    <div class="product-grid">
        {% for product in products %}
        <div class="product-card glassmorphism">
            <img class="product-image" src="{{ product.image.url|default:'#' }}" alt="{{ product.name }}">
            <div class="product-info">
                <h3 class="product-title">{{ product.name }}</h3>
                <div class="product-price">${{ product.price|floatformat:2 }}</div>
                <div style="display: flex; gap: 1rem; margin-top: auto;">
                    <button data-product="{{product.id}}" data-action="add" class="btn btn-primary add-btn update-cart" style="flex: 1;">Add to Cart</button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock content %}
